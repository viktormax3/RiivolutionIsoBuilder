name: Build Windows Packages

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows GUI packages
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore app
        run: dotnet restore src/RiivolutionIsoBuilder.App/RiivolutionIsoBuilder.App.csproj --runtime win-x64

      - name: Build app
        run: dotnet build src/RiivolutionIsoBuilder.App/RiivolutionIsoBuilder.App.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Build Avalonia desktop host
        run: dotnet build src/RiivolutionIsoBuilder.Avalonia/RiivolutionIsoBuilder.Avalonia.csproj --configuration Release

      - name: Package standalone
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration Release -OutputRoot artifacts -Runtime win-x64

      - name: Package framework-dependent
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration Release -OutputRoot artifacts -Runtime win-x64 -FrameworkDependent

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: RiivolutionIsoBuilder-win-x64-standalone
          path: artifacts/RiivolutionIsoBuilder-win-x64-standalone.zip
          if-no-files-found: error

      - name: Upload framework-dependent package
        uses: actions/upload-artifact@v4
        with:
          name: RiivolutionIsoBuilder-win-x64-framework-dependent
          path: artifacts/RiivolutionIsoBuilder-win-x64-framework-dependent.zip
          if-no-files-found: error
