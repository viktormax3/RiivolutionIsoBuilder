name: Release Windows Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore app
        run: dotnet restore src/RiivolutionIsoBuilder.App/RiivolutionIsoBuilder.App.csproj --runtime win-x64

      - name: Build app
        run: dotnet build src/RiivolutionIsoBuilder.App/RiivolutionIsoBuilder.App.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Package standalone
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration Release -OutputRoot artifacts -Runtime win-x64

      - name: Package framework-dependent
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration Release -OutputRoot artifacts -Runtime win-x64 -FrameworkDependent

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RiivolutionIsoBuilder-win-x64-standalone.zip
            artifacts/RiivolutionIsoBuilder-win-x64-framework-dependent.zip
